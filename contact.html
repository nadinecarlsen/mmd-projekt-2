<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact form SAFE SPACE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>
<body class="bodycontact">

    <header> 


        <nav class="nav">
            <a href="#">Menu</a>
            <a href="index.html" class="logo">SAFE SPACE</a>
            <a href="#">Contact</a>
		</nav>


	</header>
    
    
    <main class="contactform">


        <h1>Contact SAFE SPACE</h1>
        <p class="contact-text">Contact SAFE SPACE through this contact form:</p>

            <form>


                <label class="visually-hidden" for="name">Name</label>
                <input id="name" type="text" placeholder="Name"> 

                <label class="visually-hidden" for="mail">E-mail</label>
                <input id="mail" type="email" placeholder="E-mail"> 

                <label class="visually-hidden" for="tel">Phone</label>
                <input id="tel" type="tel" placeholder="Phone">

                <label class="visually-hidden" for="address">Address</label>
                <input id="address" type="text" placeholder="Address"> 


                <fieldset class="fieldset">
                    <legend>Suggest letter layouts and themes!</legend>
                    <label class="suggestions" for="suggestions">Write your suggestions here:</label>
                    <textarea id="suggestions" cols="30" rows="10"></textarea>
                </fieldset>


                <input type="submit" name="submit" value="Send" class="submit">


            </form>

       
    </main>


     <footer class="footer">


        <div>
            <p>E-mail: safespace@universe.com</p>
            <p>Number: 1111111111111111111111</p>
        </div>
        <p>You are a shining star!</p>


    </footer>


</body>
</html>
